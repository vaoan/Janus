name: Create GitHub Release

# TODO(infra): No changes needed — this workflow is project-agnostic.
# It auto-creates a GitHub Release when a release/* branch is merged into main.
# Verify that the PR title convention matches: "chore(release): vYYYY.MM.DD.N"

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    timeout-minutes: 5
    steps:
      - name: Extract version from PR title
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          VERSION=$(echo "$PR_TITLE" | grep -oP 'v\d{4}\.\d{2}\.\d{2}\.\d+')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from PR title: $PR_TITLE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" \
            --repo "$GH_REPO" \
            --title "$VERSION" \
            --generate-notes \
            --target main
